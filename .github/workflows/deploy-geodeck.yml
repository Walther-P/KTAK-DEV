name: Deploy GeoDeck

on:
  push:
    paths:
      - '_deploy/geodeck-pages-deploy.zip'
      - '.github/workflows/deploy-geodeck.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geodeck-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack GeoDeck without touching KTAK root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf geodeck
          mkdir -p geodeck
          unzip -q _deploy/geodeck-pages-deploy.zip -d geodeck
          test -f geodeck/index.html
          test -f geodeck/app.js
          test -f geodeck/styles.css
          test -f geodeck/manifest.webmanifest
          test -f geodeck/sw.js

      - name: Commit deployed GeoDeck
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geodeck
          if git diff --cached --quiet; then
            echo 'GeoDeck already current.'
          else
            git commit -m 'deploy(geodeck): publish mobile PWA prototype'
            git push origin HEAD:main
          fi

      - name: Verify GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          URL='https://walther-p.github.io/KTAK-DEV/geodeck/'
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --retry 2 --retry-delay 1 "$URL?probe=${GITHUB_RUN_ID}-$i" >/tmp/geodeck.html; then
              if grep -Fq '<title>GeoDeck</title>' /tmp/geodeck.html; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          test "$ok" = 1
