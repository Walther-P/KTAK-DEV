name: Verify GeoDeck live
on:
  push:
    branches: [main]
    paths:
      - 'geodeck/**'
      - '.github/workflows/verify-geodeck-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate location, navigation and saved-place logic
        run: |
          node --test geodeck/tests/*.test.js
          node --check geodeck/app.js
          node --check geodeck/layers.js
          node --check geodeck/sw.js
      - name: Verify published version and files
        shell: bash
        run: |
          set -euo pipefail
          URL='https://walther-p.github.io/KTAK-DEV/geodeck'
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('geodeck/package.json')).version")
          ok=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 15 "$URL/?probe=${GITHUB_RUN_ID}-$i" >/tmp/geodeck-page.html; then
              if grep -Fq "content=\"$VERSION\"" /tmp/geodeck-page.html; then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          test "$ok" = 1
          for file in app.js core.js layers.js styles.css sw.js manifest.webmanifest icon-192.png icon-512.png data/cameras-tw.json.gz; do
            curl -fsS --retry 2 --max-time 30 "$URL/$file?verify=${GITHUB_RUN_ID}" -o /tmp/geodeck-asset
            cmp "geodeck/$file" /tmp/geodeck-asset
          done
          echo "GeoDeck $VERSION publication verified."
