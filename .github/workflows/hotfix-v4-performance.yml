name: Apply V4 performance hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-v4-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Google page watcher and cache revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('v4-preview/index.html')
          s = index.read_text(encoding='utf-8')
          if '20260911f' not in s and '20260911g' not in s:
              raise SystemExit('preview build revision not found')
          index.write_text(s.replace('20260911f', '20260911g'), encoding='utf-8')
          a6 = Path('v4-preview/ktak-v4-alpha6.js')
          s = a6.read_text(encoding='utf-8')
          old = "function watchPageChanges(){\n  document.addEventListener('click',e=>{\n    const target=e.target?.closest?.('[data-page=\"mapPage\"],.navBtn[data-page=\"mapPage\"]');\n    if(target)setTimeout(()=>ensureGoogleDark(0),180);\n  },true);\n  const bodyObserver=new MutationObserver(()=>{\n    if(document.body.classList.contains('v4MapActive'))setTimeout(()=>ensureGoogleDark(0),180);\n    else{clearRoutePreview();clearMapGesture(true)}\n    if(!document.body.classList.contains('v4BoardActive'))clearBoardGesture(true);\n  });\n  bodyObserver.observe(document.body,{attributes:true,attributeFilter:['class']});\n}"
          new = "function watchPageChanges(){\n  const mapPage=$('mapPage'),boardPage=$('boardPage');\n  const syncMap=()=>{\n    if(mapPage?.classList.contains('active'))setTimeout(()=>ensureGoogleDark(0),180);\n    else{clearRoutePreview();clearMapGesture(true)}\n  };\n  const syncBoard=()=>{if(!boardPage?.classList.contains('active'))clearBoardGesture(true)};\n  if(mapPage)new MutationObserver(syncMap).observe(mapPage,{attributes:true,attributeFilter:['class']});\n  if(boardPage)new MutationObserver(syncBoard).observe(boardPage,{attributes:true,attributeFilter:['class']});\n}"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('page watcher patch point not found')
          a6.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v4-preview/index.html v4-preview/ktak-v4-alpha6.js
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix(v4): scope Google watcher to map page activity'
          git push origin HEAD:main
