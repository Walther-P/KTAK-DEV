name: Verify KTAK V4 Google live

on:
  push:
    paths:
      - 'v4-preview/index.html'
      - 'v4-preview/app-shell-alpha4.html'
      - 'v4-preview/ktak-v4-alpha5.js'
      - 'v4-preview/ktak-v4-alpha5.css'
      - 'v4-preview/ktak-v4-alpha6.js'
      - 'v4-preview/ktak-v4-alpha6.css'
      - '.github/workflows/verify-v4-google-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-google-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for live alpha6 frame bootstrap identity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://walther-p.github.io/KTAK-DEV/v4-preview/'
          ok=0
          for i in $(seq 1 36); do
            INDEX="$(curl -fsS --retry 2 --retry-delay 1 "${BASE}?google-run=${GITHUB_RUN_ID}-${i}" || true)"
            INPUT="$(curl -fsS --retry 2 --retry-delay 1 "${BASE}ktak-v4-alpha6.js?google-run=${GITHUB_RUN_ID}-${i}" || true)"
            if grep -Fq 'id="ktakAppFrame"' <<<"$INDEX" && grep -Fq '20260911e' <<<"$INDEX" && grep -Fq '4.0.0-alpha.6-input' <<<"$INPUT"; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          curl -fsS --retry 4 --retry-delay 2 "${BASE}KTAK_BUILD.json?run=${GITHUB_RUN_ID}" >/tmp/build.json
          jq -e '.version=="4.0.0-alpha.4" and .baseVersion=="3.5.11" and .inputRevision=="4.0.0-alpha.6-input" and .hostingOrigin=="github-pages-v35-origin"' /tmp/build.json >/dev/null
          curl -fsS "${BASE}app-shell-alpha4.html?run=${GITHUB_RUN_ID}" | grep -Fq './ktak-v4-alpha4.js'
          curl -fsS "${BASE}ktak-v4-alpha6.js?run=${GITHUB_RUN_ID}" | grep -Fq 'DARK_GOOGLE_STYLES'

      - name: Install browser dependency
        run: npm install --no-save --package-lock=false puppeteer-core@24

      - name: Verify Google Maps renders on the actual V4 URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!exe) throw new Error('No Chrome/Chromium executable found');
          const browser=await puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          page.setDefaultTimeout(35000);
          const googleErrors=[];
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          page.on('console',m=>{if(m.type()==='error'&&/Google Maps JavaScript API error|RefererNotAllowedMapError|ApiNotActivatedMapError|InvalidKeyMapError|BillingNotEnabledMapError/i.test(m.text()))googleErrors.push(m.text())});
          try{
            await page.setViewport({width:1365,height:900,deviceScaleFactor:1,isMobile:false,hasTouch:false});
            await page.goto('https://walther-p.github.io/KTAK-DEV/v4-preview/?google-live-check='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const w=document.getElementById('ktakAppFrame')?.contentWindow;
              return w?.__KTAK_V4?.version==='4.0.0-alpha.4'&&w?.__KTAK_V4_BRIDGE?.baseVersion==='3.5.11'&&w?.__KTAK_V4_REFINEMENT?.version==='4.0.0-alpha.5-refine'&&w?.__KTAK_V4_INPUT?.version==='4.0.0-alpha.6-input';
            });
            const result=await page.evaluate(async()=>{
              const f=document.getElementById('ktakAppFrame'),w=f.contentWindow,d=f.contentDocument;
              const key=w.KTAK_CONFIG?.GOOGLE_MAPS_API_KEY;
              if(!key)return{ok:false,reason:'missing-key'};
              if(!w.google?.maps){
                await new Promise((resolve,reject)=>{
                  let settled=false;const done=fn=>{if(settled)return;settled=true;fn()};
                  const cb='__ktakGoogleLive'+Date.now();
                  w[cb]=()=>done(()=>{delete w[cb];resolve()});
                  const s=d.createElement('script');
                  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback='+cb+'&v=weekly&language=zh-TW&region=TW';
                  s.onerror=()=>done(()=>reject(new Error('script-load')));
                  d.head.appendChild(s);
                  setTimeout(()=>done(()=>reject(new Error('timeout'))),12000);
                });
              }
              const box=d.createElement('div');
              box.style.cssText='position:fixed;left:0;top:0;width:900px;height:650px;z-index:999999';
              d.body.append(box);
              const styles=[
                {elementType:'geometry',stylers:[{color:'#172126'}]},
                {elementType:'labels.text.stroke',stylers:[{color:'#172126'}]},
                {elementType:'labels.text.fill',stylers:[{color:'#9aa8ae'}]},
                {featureType:'road',elementType:'geometry',stylers:[{color:'#2a373d'}]},
                {featureType:'water',elementType:'geometry',stylers:[{color:'#0b2734'}]}
              ];
              const gm=new w.google.maps.Map(box,{center:{lat:23.0,lng:120.21},zoom:16,mapTypeId:'roadmap',styles,disableDefaultUI:true,backgroundColor:'#10181d'});
              await new Promise(r=>setTimeout(r,2500));
              const authErr=!!box.querySelector('.gm-err-container,.gm-err-content');
              const rendered=!!box.querySelector('.gm-style');
              const mapType=gm.getMapTypeId();
              const configuredStyles=Array.isArray(gm.get('styles'))&&gm.get('styles').length>0;
              box.remove();
              return{ok:!!w.google?.maps&&rendered&&!authErr,authErr,rendered,mapType,configuredStyles,inputRevision:w.__KTAK_V4_INPUT?.version};
            }).catch(e=>({ok:false,reason:String(e?.message||e)}));
            if(!result.ok||googleErrors.length)throw new Error('Google Maps live authorization/render failed: '+JSON.stringify({result,googleErrors,pageErrors}));
            if(result.mapType!=='roadmap'||!result.configuredStyles)throw new Error('Dark roadmap configuration test failed: '+JSON.stringify(result));
            console.log(JSON.stringify(result));
            console.log('Google Maps renders successfully on the live V4 GitHub Pages origin with alpha6 loaded.');
          } finally {await browser.close()}
          NODE

      - name: Verify V3.5 production root stayed byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/pre-v4-alpha6-input-20260911
          git diff --exit-code origin/archive/pre-v4-alpha6-input-20260911 -- index.html config.js manifest.webmanifest sw.js README.md
          echo 'V3.5 production root unchanged.'
